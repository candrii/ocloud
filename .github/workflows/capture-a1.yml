name: Capture A1

on:
  # GitHub often skips scheduled runs, so each run queues the next one. The schedule only
  # restarts the chain if it breaks.
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # request the GitHub OIDC token exchanged for an OCI UPST
  actions: write # queue the next run, and disable this workflow once all instances exist

concurrency:
  group: capture-a1
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install OCI CLI
        run: pipx install oci-cli==3.95.0

      - name: Log in to OCI with OIDC
        env:
          OCI_DOMAIN_URL: ${{ secrets.OCI_DOMAIN_URL }}
          OCI_CLIENT_ID: ${{ secrets.OCI_CLIENT_ID }}
          OCI_CLIENT_SECRET: ${{ secrets.OCI_CLIENT_SECRET }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: scripts/oci-oidc-login.sh

      - name: Launch missing instances
        id: launch
        timeout-minutes: 5
        env:
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_COMPARTMENT: ${{ secrets.OCI_COMPARTMENT }}
          OCI_SUBNET: ${{ secrets.OCI_SUBNET }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/capture-a1.sh

      # Also runs after a failure, so a brief error can't end the capture. Cancelling a run
      # or disabling the workflow stops the chain.
      - name: Queue the next attempt
        if: ${{ !cancelled() && steps.launch.outputs.done != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 240
          gh workflow run capture-a1.yml --repo "$GITHUB_REPOSITORY" --ref main
